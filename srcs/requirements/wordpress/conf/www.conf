[www]
user = www-data
group = www-data

; Escuchar en todas las interfaces: NGINX vive en otro contenedor y necesita
; alcanzar php-fpm por red (fastcgi_pass wordpress:9000), no por socket Unix.
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
